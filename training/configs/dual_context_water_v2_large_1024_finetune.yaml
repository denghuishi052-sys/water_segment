train_manifest: data/satellite_adaptation_1024_v1/combined_train.csv
val_manifest: data/satellite_adaptation_1024_v1/satellite_val.csv
output_dir: runs/dual_context_water/v2_large_1024_finetune
init_checkpoint: runs/dual_context_water/v2_large_convnext_small_tiny/best.pt

local_backbone: convnext_small
global_backbone: convnext_tiny
decoder_channels: 256
decoder_norm: group
pretrained: false
context_gamma_scale: 0.5
context_beta_scale: 0.25
gradient_checkpointing: true

epochs: 100
min_epochs: 100
patience: 20
max_hours: 56
freeze_encoder_epochs: 0
batch_size: 1
gradient_accumulation: 4
workers: 2
learning_rate: 0.000005
weight_decay: 0.0002
global_loss_weight: 0.25
quality_loss_weight: 0.05
tversky_weight: 0.35
tversky_alpha: 0.45
tversky_beta: 0.55
boundary_loss_weight: 0.12
satellite_batch_fraction: 0.45
false_positive_weight: 1.10
gradient_clip_norm: 0.5
reset_best_metric: true
amp: true
amp_dtype: bfloat16
seed: 20260802
