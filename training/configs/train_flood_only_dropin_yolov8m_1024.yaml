# Single-class flood model. Its ONNX output is drop-in compatible with the
# existing .NET YOLOv8-seg postprocessor (nc=1, nm=32).
model: runs/segment/runs/segment/floodnet_yolov8m_1024_b4/weights/best.pt
data: data/floodnet_flood_only_1024/processed/flood_only.yaml
imgsz: 1024
epochs: 120
batch: 4
device: 0
workers: 2
cache: false
amp: true
cos_lr: true
close_mosaic: 20
patience: 40
optimizer: AdamW
lr0: 0.0003
momentum: 0.9
weight_decay: 0.0005
hsv_h: 0.015
hsv_s: 0.35
hsv_v: 0.35
degrees: 10
translate: 0.08
scale: 0.45
fliplr: 0.50
flipud: 0.50
mosaic: 0.60
mixup: 0.0
project: runs/segment
name: flood_only_dropin_yolov8m_1024_e120
exist_ok: false
