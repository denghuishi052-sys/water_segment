train_manifest: data/satellite_adaptation_v1/combined_train.csv
val_manifest: data/satellite_adaptation_v1/satellite_val.csv
output_dir: runs/dual_context_water/satellite_adapt_ian_to_ida_fp32
init_checkpoint: runs/dual_context_water/satellite_adapt_ian_to_ida_stable/best.pt

local_backbone: convnext_tiny
global_backbone: mobilenetv3_large_100
decoder_channels: 128
pretrained: false
context_beta_scale: 1.0
reset_decoder_batchnorm: false

epochs: 20
min_epochs: 10
batch_size: 4
gradient_accumulation: 1
workers: 2
learning_rate: 0.000005
weight_decay: 0.0002
global_loss_weight: 0.25
quality_loss_weight: 0.05
satellite_batch_fraction: 0.35
false_positive_weight: 1.25
gradient_clip_norm: 0.5
reset_best_metric: false
amp: false
patience: 7
seed: 20260730
